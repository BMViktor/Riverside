<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px}body{display:grid;grid-template-columns:1fr 320px}
.main{background:var(--sage-800);display:grid;place-items:center}
.wm{font-family:var(--font-display);font-size:150px;line-height:1;color:var(--n-50);letter-spacing:-.015em}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style></head>
<body><div class="main"><div class="wm">Riverside</div></div>
<div class="strip"><div style="background:var(--sage-300)"></div><div style="background:var(--slate-400)"></div><div style="background:var(--clay-500)"></div><div style="background:var(--n-800)"></div></div>
</body></html>
