<!-- @dsCard group="Brand" viewport="700x160" name="Links, hover, press, focus" subtitle="Sage underline turning clay on hover. Press is a 1px nudge; focus is a pine outline + ring." -->
<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.sw{display:flex;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}
.grid{display:flex;gap:10px}.chip{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}.chip .c{height:52px}.chip .t{padding:6px 8px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted);background:var(--surface-card)}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style></head><body>
<div style="display:flex;flex-direction:column;gap:16px;font-size:15px">
<div>Kérdés van? <a href="#">Írj nekünk</a>, vagy nézd meg a <a href="#">házirendet</a>.</div>
<div style="display:flex;gap:14px;align-items:center">
<span style="background:var(--action-primary-bg);color:var(--action-primary-fg);padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:500">alap</span>
<span style="background:var(--action-primary-bg-hover);color:var(--action-primary-fg);padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:500">hover</span>
<span style="background:var(--action-primary-bg-active);color:var(--action-primary-fg);padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;transform:translateY(1px)">press</span>
<span style="background:var(--surface-card);border:1px solid var(--border-focus);box-shadow:var(--ring-focus);padding:9px 20px;border-radius:var(--radius-sm);font-size:14px">focus</span></div></div>
</body></html>
