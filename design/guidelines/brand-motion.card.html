<!-- @dsCard group="Brand" viewport="700x180" name="Motion" subtitle="120 / 180 / 280ms, decelerating. No bounce, no spring, no parallax." -->
<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.sw{display:flex;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}
.grid{display:flex;gap:10px}.chip{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}.chip .c{height:52px}.chip .t{padding:6px 8px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted);background:var(--surface-card)}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--text-body)">
<div style="display:flex;gap:14px;align-items:center"><span class="lbl" style="width:120px">fast · 120ms</span><span>hover, fókusz, színváltás</span></div>
<div style="display:flex;gap:14px;align-items:center"><span class="lbl" style="width:120px">base · 180ms</span><span>kártya emelés, switch</span></div>
<div style="display:flex;gap:14px;align-items:center"><span class="lbl" style="width:120px">slow · 280ms</span><span>dialógus belépés, 8px felfelé</span></div>
<div style="display:flex;gap:14px;align-items:center"><span class="lbl" style="width:120px">image · 600ms</span><span>galéria áttűnés</span></div>
<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:4px">--ease-out cubic-bezier(.22,.61,.36,1) · --ease-entrance cubic-bezier(.16,1,.3,1)</div></div>
</body></html>
