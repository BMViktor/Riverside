<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Page is warm white, cards pure white. Sunken and muted separate blocks without borders." -->
<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.sw{display:flex;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}
.grid{display:flex;gap:10px}.chip{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}.chip .c{height:52px}.chip .t{padding:6px 8px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted);background:var(--surface-card)}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style></head><body>
<div class="grid"><div class="chip"><div class="c" style="background:var(--surface-page)"></div><div class="t">--surface-page</div></div><div class="chip"><div class="c" style="background:var(--surface-card)"></div><div class="t">--surface-card</div></div><div class="chip"><div class="c" style="background:var(--surface-sunken)"></div><div class="t">--surface-sunken</div></div><div class="chip"><div class="c" style="background:var(--surface-muted)"></div><div class="t">--surface-muted</div></div><div class="chip"><div class="c" style="background:var(--surface-accent)"></div><div class="t">--surface-accent</div></div><div class="chip"><div class="c" style="background:var(--surface-inverse)"></div><div class="t">--surface-inverse</div></div></div>
</body></html>
