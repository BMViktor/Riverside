<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.sw{display:flex;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}
.grid{display:flex;gap:10px}.chip{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}.chip .c{height:52px}.chip .t{padding:6px 8px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted);background:var(--surface-card)}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style></head><body>
<div style="display:flex;gap:14px">
<div style="position:relative;flex:1.4;height:150px;border-radius:var(--radius-md);overflow:hidden;background:repeating-linear-gradient(135deg,var(--sage-100) 0 10px,var(--sage-50) 10px 20px)">
<div style="position:absolute;inset:0;background:var(--scrim-bottom)"></div>
<div style="position:absolute;left:16px;bottom:14px;color:var(--n-50)"><div style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.85">Környék</div><div style="font-family:var(--font-display);font-size:26px">A gátoldal naplementében</div></div></div>
<div style="flex:1;height:150px;border-radius:var(--radius-md);background:repeating-linear-gradient(135deg,var(--slate-100) 0 10px,var(--slate-50) 10px 20px);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--slate-500)">valódi fotó helye</div></div>
<div class="lbl" style="margin-top:12px">--scrim-bottom · 4/3 kártya · 16/9 széles · 21/9 hero</div>
</body></html>
