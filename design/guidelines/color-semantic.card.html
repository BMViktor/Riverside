<!-- @dsCard group="Colors" viewport="700x150" name="Status colours" subtitle="Success is sage, not a generic green — status stays inside the palette." -->
<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.sw{display:flex;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}
.grid{display:flex;gap:10px}.chip{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}.chip .c{height:52px}.chip .t{padding:6px 8px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted);background:var(--surface-card)}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style></head><body>
<div class="grid"><div class="chip"><div class="c" style="background:var(--status-success-bg);display:flex;align-items:center;justify-content:center;color:var(--status-success-fg);font-size:13px;font-weight:500">Szabad</div><div class="t">--status-success-*</div></div><div class="chip"><div class="c" style="background:var(--status-warning-bg);display:flex;align-items:center;justify-content:center;color:var(--status-warning-fg);font-size:13px;font-weight:500">Előjegyzés</div><div class="t">--status-warning-*</div></div><div class="chip"><div class="c" style="background:var(--status-danger-bg);display:flex;align-items:center;justify-content:center;color:var(--status-danger-fg);font-size:13px;font-weight:500">Betelt</div><div class="t">--status-danger-*</div></div><div class="chip"><div class="c" style="background:var(--status-info-bg);display:flex;align-items:center;justify-content:center;color:var(--status-info-fg);font-size:13px;font-weight:500">2 éj minimum</div><div class="t">--status-info-*</div></div></div>
</body></html>
