<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.sw{display:flex;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}
.grid{display:flex;gap:10px}.chip{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}.chip .c{height:52px}.chip .t{padding:6px 8px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted);background:var(--surface-card)}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style></head><body>
<div style="display:flex;gap:16px;align-items:flex-end"><div style="text-align:center"><div style="width:74px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:2px"></div><div class="lbl" style="margin-top:6px">xs · 2px</div></div><div style="text-align:center"><div style="width:74px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:4px"></div><div class="lbl" style="margin-top:6px">sm · 4px</div></div><div style="text-align:center"><div style="width:74px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:8px"></div><div class="lbl" style="margin-top:6px">md · 8px</div></div><div style="text-align:center"><div style="width:74px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:14px"></div><div class="lbl" style="margin-top:6px">lg · 14px</div></div><div style="text-align:center"><div style="width:74px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:20px"></div><div class="lbl" style="margin-top:6px">xl · 20px</div></div>
<div style="text-align:center"><div style="width:74px;height:32px;background:var(--surface-muted);border-radius:999px"></div><div class="lbl" style="margin-top:6px">pill · tag</div></div></div>
</body></html>
