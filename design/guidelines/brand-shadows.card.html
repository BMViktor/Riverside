<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.sw{display:flex;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}
.grid{display:flex;gap:10px}.chip{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}.chip .c{height:52px}.chip .t{padding:6px 8px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted);background:var(--surface-card)}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style></head><body>
<div style="display:flex;gap:18px;align-items:center"><div style="text-align:center"><div style="width:130px;height:72px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-xs)"></div><div class="lbl" style="margin-top:10px">xs</div></div><div style="text-align:center"><div style="width:130px;height:72px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div><div class="lbl" style="margin-top:10px">sm</div></div><div style="text-align:center"><div style="width:130px;height:72px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div><div class="lbl" style="margin-top:10px">md</div></div><div style="text-align:center"><div style="width:130px;height:72px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div><div class="lbl" style="margin-top:10px">lg</div></div></div>
</body></html>
