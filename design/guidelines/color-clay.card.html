<!-- @dsCard group="Colors" viewport="700x160" name="Clay — the only accent" subtitle="Booking CTAs and nothing else. If it is clay, it is bookable." -->
<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.sw{display:flex;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}
.grid{display:flex;gap:10px}.chip{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}.chip .c{height:52px}.chip .t{padding:6px 8px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted);background:var(--surface-card)}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style></head><body>
<div class="sw" style="margin-bottom:12px"><div style="background:var(--clay-100);color:#2A2E2D">100</div><div style="background:var(--clay-200);color:#2A2E2D">200</div><div style="background:var(--clay-300);color:#2A2E2D">300</div><div style="background:var(--clay-500);color:#fff">500</div><div style="background:var(--clay-600);color:#fff">600</div><div style="background:var(--clay-700);color:#fff">700</div></div>
<div style="display:flex;gap:12px;align-items:center"><span style="background:var(--action-accent-bg);color:#fff;font-size:14px;font-weight:500;padding:10px 20px;border-radius:var(--radius-sm)">Foglalás</span><span class="lbl">--action-accent-bg = --clay-500</span></div>
</body></html>
