<!-- @dsCard group="Colors" viewport="700x170" name="Text colours" subtitle="Four ink levels. Running text never goes lighter than --n-500 on white." -->
<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.sw{display:flex;border-radius:var(--radius-sm);overflow:hidden}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}
.grid{display:flex;gap:10px}.chip{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}.chip .c{height:52px}.chip .t{padding:6px 8px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted);background:var(--surface-card)}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style></head><body>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="color:var(--text-heading);font-size:18px">--text-heading · Pár nap a folyó mellett.</div>
<div style="color:var(--text-body);font-size:15px">--text-body · Négy szoba, nagy kert, medence és két kajak a parton.</div>
<div style="color:var(--text-muted);font-size:14px">--text-muted · Az árak reggelivel értendők.</div>
<div style="color:var(--text-subtle);font-size:13px">--text-subtle · placeholder és metaadat</div>
<div style="background:var(--surface-inverse);color:var(--text-inverse);font-size:14px;padding:8px 10px;border-radius:var(--radius-sm)">--text-inverse · antracit felületen</div></div>
</body></html>
